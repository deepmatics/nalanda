input_data:
  provider: "huggingface"
  dataset: "deepmatics/open_ragbench"
  data_path: "./data/input/OpenRAGBench/" 

hf:
  embeddings: "google/embeddinggemma-300m"
  llm_model: "openai/gpt-5-nano"

sample:
  state: 42
  size: 300 # int value between 0 to len(queries) golden dataset

query_settings:
  use: false  # Set to false to disable query rewriting
  type: "rewrite"  # TODO: "expansion", "hypothetical"

chunking:
  size: 500
  overlap: 100

vector_db:
  batch_size: 100
  persist_dir: "./chroma_db/OpenRagBench"